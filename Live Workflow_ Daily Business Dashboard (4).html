<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Live Workflow: Daily Business Dashboard</title>
    <style>
        :root {
            --bg: #f3f5fb;
            --card: rgba(255, 255, 255, .82);
            --text: #0f172a;
            --mut: #64748b;
            --line: #dde3f0;
            --accent: #4f46e5;
            --good: #059669;
            --bad: #e11d48;
            --badbg: #ffe9ee;
            --gold: #d97706;
            --canvas: #f7f8fb;
            --dot: #d3d8e4;
            --nb: #fff;
            --nl: #c5cad8;
            --edge: #9aa1b5;
            --coral: #ff6d5a;
            --ok: #2fae6b;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #070b16;
                --card: rgba(20, 28, 50, .72);
                --text: #eef2ff;
                --mut: #94a3c4;
                --line: rgba(148, 163, 210, .22);
                --accent: #818cf8;
                --good: #34d399;
                --bad: #fb7185;
                --badbg: rgba(244, 63, 94, .14);
                --gold: #fbbf24;
                --canvas: #14161f;
                --dot: #2c3040;
                --nb: #262938;
                --nl: #454a5e;
                --edge: #6b7390;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #070b16;
            --card: rgba(20, 28, 50, .72);
            --text: #eef2ff;
            --mut: #94a3c4;
            --line: rgba(148, 163, 210, .22);
            --accent: #818cf8;
            --good: #34d399;
            --bad: #fb7185;
            --badbg: rgba(244, 63, 94, .14);
            --gold: #fbbf24;
            --canvas: #14161f;
            --dot: #2c3040;
            --nb: #262938;
            --nl: #454a5e;
            --edge: #6b7390;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            color: var(--text);
            font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: radial-gradient(900px 480px at 12% -8%, color-mix(in srgb, var(--accent) 24%, transparent), transparent), radial-gradient(700px 420px at 100% 0, rgba(236, 72, 153, .13), transparent), var(--bg);
            background-attachment: fixed;
            min-height: 100vh
        }

        main {
            max-width: 1040px;
            margin: 0 auto;
            padding: 26px 14px 30px
        }

        .top {
            display: flex;
            align-items: center;
            gap:

                12px;
            flex-wrap: wrap
        }

        h1 {
            font-size: 30px;
            margin: 0;
            font-weight: 800;
            letter-spacing: -.035em;
            background: linear-gradient(90deg, var(--text) 30%, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .live {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .1em;
            color: var(--good);
            border: 1px solid var(--good);
            padding: 4px 11px;
            border-radius: 999px;
            display: inline-flex;
            gap: 7px;
            align-items: center
        }

        .live i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--good);
            animation: pu 1.4s infinite
        }

        @keyframes pu {
            50% {
                opacity: .25;
                transform: scale(1.6)
            }
        }

        p.sub {
            margin: 6px 0 16px;
            color: var(--mut);
            font-size: 14px
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px
        }

        button {
            font: inherit;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: transform .15s
        }

        button:active {
            transform: scale(.96)
        }

        button.p {
            background: linear-gradient(135deg, #ff6d5a, #ff8a5a);
            border: 0;
            color: #fff;
            box-shadow: 0 10px 24px -10px #ff6d5a
        }

        .card {
            background: var(--card);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 18px 40px -20px rgba(15, 23, 42, .35)
        }

        .cv {
            position: relative;
            border-radius: 20px;
            border: 1px solid var(--line);
            overflow-x: auto;
            background-color: var(--canvas);
            background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
            background-size: 22px 22px
        }

        .cv svg {
            min-width: 860px;
            width: 100%;
            display: block
        }

        .chip {
            position: sticky;
            left: 12px;
            top: 12px;
            display: inline-flex;
            gap: 10px;
            align-items: center;
            margin: 12px;
            padding: 6px 12px;
            border-radius: 10px;
            background: var(--nb);
            border: 1px solid var(--nl);
            font-size: 12px;
            font-weight: 600;
            z-index: 2
        }

        .chip b {
            color: var(--ok);
            font-weight: 600
        }

        .nd .b {
            fill: var(--nb);
            stroke: var(--nl);
            stroke-width: 1.5;
            transition: stroke .25s
        }

        .nd text {
            fill: var(--text);
            font-size: 12px;
            font-weight: 600;
            text-anchor: middle
        }

        .nd .s {
            fill: var(--mut);
            font-size: 10px;
            font-weight: 400
        }

        .nd.run .b {
            stroke: var(--coral);
            stroke-width: 2;
            stroke-dasharray: 6 4;
            animation: d .6s linear infinite;
            filter: drop-shadow(0 0 6px var(--coral))
        }

        .nd.ok .b {
            stroke: var(--ok);
            stroke-width: 2
        }

        .nd.gold .b {
            stroke: var(--gold);
            stroke-width: 2;
            filter: drop-shadow(0 0 6px var(--gold))
        }

        .bg {
            display: none
        }

        .nd.ok .bg {
            display: block
        }

        .bg circle {
            fill: var(--ok)
        }

        .ed {
            fill: none;
            stroke: var(--edge);
            stroke-width: 1.8;
            transition: stroke .3s
        }

        .ed.ok {
            stroke: var(--ok)
        }

        @keyframes d {
            to {
                stroke-dashoffset: -10
            }
        }

        .mk {
            fill: var(--edge)
        }

        .pt {
            fill: var(--nb);
            stroke: var(--edge);
            stroke-width: 1.5
        }

        .il {
            fill: var(--ok);
            font-size: 10px;
            font-weight: 600;
            opacity: 0;
            transition: .3s
        }

        .il.show {
            opacity: 1
        }

        .pl {
            fill: var(--mut);
            font-size: 9.5px
        }

        .pk {
            fill: var(--coral);
            filter: drop-shadow(0 0 7px var(--coral))
        }

        .pk.gold {
            fill: var(--gold);
            filter: drop-shadow(0 0 8px var(--gold))
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 12px 0
        }

        .k {
            position: relative;
            overflow: hidden
        }

        .k::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #ec4899)
        }

        .k .l {
            color: var(--mut);
            text-transform: uppercase;
            letter-spacing: .07em;
            font-size: 11px;
            font-weight: 600
        }

        .k .v {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -.035em;
            margin: 4px 0;
            font-variant-numeric: tabular-nums
        }

        .k .d {
            font-size: 12px;
            color: var(--good)
        }

        .k.flag {
            border-color: var(--bad);
            background: var(--badbg)
        }

        .k.flag::before {
            background: var(--bad)
        }

        .k.flag .d {
            color: var(--bad)
        }

        .two {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 10px
        }

        h2 {
            font-size: 11.5px;
            margin: 0 0 8px;
            color: var(--mut);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 13px
        }

        li {
            padding: 5px 0;
            border-bottom: 1px solid var(--line)
        }

        li:last-child {
            border: 0
        }

        li b {
            color: var(--mut);
            font-weight: 500;
            margin-right: 6px
        }

        li.gold {
            color: var(--gold)
        }

        li.bad {
            color: var(--bad)
        }

        li.good {
            color: var(--good)
        }

        #banner {
            display: none;
            margin: 12px 0 0;
            padding: 10px 12px;
            border-radius: 14px;
            background: var(--badbg);
            border: 1px solid var(--bad);
            color: var(--bad);
            font-weight: 600
        }

        .bars rect {
            fill: var(--accent);
            opacity: .5;
            transform-box: fill-box;
            transform-origin: bottom
        }

        .bars rect.new {
            opacity: 1;
            animation: g .6s ease-out;
            filter: drop-shadow(0 0 6px var(--accent))
        }

        @keyframes g {
            from {
                transform: scaleY(0)
            }
        }

        .bars text {
            fill: var(--mut);
            font-size: 10px;
            text-anchor: middle
        }

        .exg {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px
        }

        .ex {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px;
            transition: .25s
        }

        .ex.act {
            border-color: var(--coral);
            box-shadow: 0 0 0 1px var(--coral)
        }

        .ex.done {
            border-color: var(--ok)
        }

        .eh {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px
        }

        .eh b {
            display: block;
            font-size: 13px
        }

        .eh span {
            font-size: 11px;
            color: var(--mut)
        }

        .ex ol {
            margin: 0 0 8px;
            padding-left: 18px;
            font-size: 12px;
            color: var(--mut)
        }

        .ex li {
            padding: 2px 0;
            border: 0;
            opacity: .35;
            transition: .25s
        }

        .ex li.on {
            opacity: 1;
            color: var(--text)
        }

        .sm {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: .4s
        }

        .ex.done .sm {
            opacity: 1;
            max-height: 220px
        }

        .sm table {
            width: 100%;
            font-size: 11px;
            border-collapse: collapse
        }

        .sm th {
            text-align: left;
            color: var(--mut);
            font-weight: 600;
            padding: 2px 4px;
            border-bottom: 1px solid var(--line)
        }

        .sm td {
            padding: 3px 4px
        }

        .sm p {
            margin: 6px 0 0;
            font-size: 11px;
            color: var(--ok);
            font-weight: 700
        }

        .calc {
            margin-bottom: 10px
        }

        .cr {
            display: grid;
            grid-template-columns: 104px 1fr;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
            opacity: 0;
            transform: translateY(6px);
            animation: cr .4s forwards
        }

        .cr:last-child {
            border: 0
        }

        @keyframes cr {
            to {
                opacity: 1;
                transform: none
            }
        }

        .cr b {
            color: var(--mut);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .07em;
            padding-top: 2px
        }

        .cr code {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            line-height: 1.6
        }

        .cr em {
            font-style: normal;
            font-weight: 700;
            color: var(--accent)
        }

        .cr em.w {
            color: var(--bad)
        }

        .cvw {
            position: relative
        }

        .cv svg {
            transition: opacity .25s
        }

        .cv.dim svg {
            opacity: .25
        }

        .ndv {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(620px, 94%);
            max-height: 96%;
            overflow: hidden;
            transform: translate(-50%, -46%) scale(.94);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            background: var(--nb);
            border: 1px solid var(--nl);
            border-radius: 16px;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5);
            z-index: 5
        }

        .ndv.open {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1)
        }

        .nh {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--nl)
        }

        .nh svg {
            width: 32px;
            height: 32px;
            flex: none
        }

        .nh b {
            display: block;
            font-size: 15px
        }

        .nh small {
            color: var(--mut);
            font-size: 11px
        }

        .pill {
            margin-left: auto;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid var(--coral);
            color: var(--coral)
        }

        .pill.ok {
            border-color: var(--ok);
            color: var(--ok)
        }

        .nb {
            padding: 12px 16px;
            display: grid;
            gap: 12px;
            max-height: 380px;
            overflow-y: auto
        }

        .nb h4 {
            margin: 0 0 6px;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--mut)
        }

        .pm {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .pm span {
            font-size: 11.5px;
            padding: 3px 9px;
            border-radius: 8px;
            background: color-mix(in srgb, var(--accent) 12%, transparent)
        }

        .pm span b {
            color: var(--mut);
            font-weight: 600;
            margin-right: 5px
        }

        .ln {
            font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
            padding: 6px 10px;
            border-left: 3px solid var(--coral);
            margin-bottom: 4px;
            opacity: 0;
            transform: translateX(-8px);
            animation: cr .35s forwards;
            background: color-mix(in srgb, var(--text) 5%, transparent);
            border-radius: 0 8px 8px 0
        }

        .ln em {
            font-style: normal;
            font-weight: 700;
            color: var(--accent)
        }

        .ln em.w {
            color: var(--bad)
        }

        .ln b {
            color: var(--mut)
        }

        .ot table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px
        }

        .ot th {
            text-align: left;
            color: var(--mut);
            font-weight: 600;
            padding: 3px 6px;
            border-bottom: 1px solid var(--nl)
        }

        .ot td {
            padding: 3px 6px
        }

        .ot p {
            margin: 6px 0 0;
            font-size: 11.5px;
            color: var(--ok);
            font-weight: 700
        }

        .em {
            border: 1px solid var(--nl);
            border-radius: 12px;
            overflow: hidden;
            font-size: 12px
        }

        .em .eh2 {
            padding: 8px 12px;
            background: color-mix(in srgb, var(--text) 5%, transparent);
            line-height: 1.7
        }

        .em .eh2 b {
            display: inline-block;
            width: 56px;
            color: var(--mut);
            font-weight: 600
        }

        .em .eb {
            padding: 10px 12px;
            line-height: 1.6
        }

        .dl {
            display: flex;
            gap: 14px;
            padding: 8px 12px;
            border-top: 1px solid var(--nl);
            font-size: 11px;
            font-weight: 700;
            color: var(--ok)
        }

        .dl span {
            opacity: 0;
            animation: cr .4s forwards
        }

        .dl span:nth-child(2) {
            animation-delay: .5s
        }

        .dl span:nth-child(3) {
            animation-delay: 1s
        }

        .inb {
            margin: 12px 0 0
        }

        .ib {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            opacity: 0;
            animation: cr .5s forwards
        }

        .ib:last-child {
            border: 0
        }

        .ib i {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: 6px;
            flex: none
        }

        .ib b {
            display: block;
            font-size: 13px
        }

        .ib small {
            color: var(--mut);
            font-size: 12px
        }

        .ib .t {
            margin-left: auto;
            font-size: 11px;
            color: var(--mut);
            white-space: nowrap
        }

        .cnt {
            display: inline-block;
            min-width: 20px;
            text-align: center;
            padding: 1px 7px;
            border-radius: 999px;
            background: var(--bad);
            color: #fff;
            font-size: 11px;
            margin-left: 6px
        }
    </style>
</head>

<body>
    <main>
        <div class="top">
            <h1>Daily Business Dashboard</h1><span class="live"><i></i>LIVE SIMULATION</span>
        </div>
        <p class="sub">Demo of the automation as it looks inside n8n. Nodes run one by one, data flows along the
            connections and the dashboard updates.</p>
        <div class="bar"><button class="p" id="sale">+ Add a sale</button><button id="prob">Simulate a
                problem</button><button id="play">Pause</button><button id="det">Node details: On</button></div>
        <div class="cvw">
            <div class="cv">
                <div class="chip">Daily Business Dashboard Auto-Refresh <b>● Active</b></div><svg id="w"
                    viewBox="0 0 990 556" role="img" aria-label="n8n style workflow"></svg>
            </div>
            <div class="ndv" id="ndv"></div>
        </div>
        <div id="banner"></div>
        <div class="card inb" id="inbox" style="display:none">
            <h2>Manager’s inbox: manager@yourcompany.com <span class="cnt" id="icnt">0</span></h2>
            <div id="ibl"></div>
        </div>
        <div class="kpis" id="kpis"></div>
        <div class="two">
            <div class="card">
                <h2>Revenue per refresh</h2><svg class="bars" id="ch" viewBox="0 0 340 130"></svg>
            </div>
            <div class="card">
                <h2>Activity log</h2>
                <ul id="log"></ul>
            </div>
        </div>
    </main>
    <script>
        const NS = "http://www.w3.org/2000/svg", $ = i => document.getElementById(i);
        const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e };
        const sleep = ms => new Promise(r => setTimeout(r, ms)), fmt = n => "₹" + Math.round(n).toLocaleString("en-IN");
        const st = (c, w = 2) => `stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
        const SH = '<path d="M4 1h11l6 6v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" fill="#0f9d58"/><path d="M15 1l6 6h-5a1 1 0 0 1-1-1z" fill="#087f45"/><rect x="6" y="11" width="12" height="8.5" rx="1" fill="#fff"/><path d="M6 14h12M6 16.8h12M11 11v8.5" stroke="#0f9d58" stroke-width="1.2"/>';
        const CR = '<circle cx="9" cy="8" r="4" fill="#f97316"/><path d="M1.5 21c0-4.5 3.4-7 7.5-7s7.5 2.5 7.5 7z" fill="#f97316"/><circle cx="17.5" cy="9" r="3" fill="#fdba74"/><path d="M16 14.3c3.8-.3 6.5 1.8 6.5 6.7H18c0-2.8-.8-4.9-2-6.7z" fill="#fdba74"/>';
        const AC = '<rect x="4" y="1.5" width="16" height="21" rx="2.5" fill="#2563eb"/><rect x="7" y="4.5" width="10" height="4.5" rx="1" fill="#fff"/><g fill="#fff"><circle cx="8.5" cy="13" r="1.3"/><circle cx="12" cy="13" r="1.3"/><circle cx="15.5" cy="13" r="1.3"/><circle cx="8.5" cy="17.5" r="1.3"/><circle cx="12" cy="17.5" r="1.3"/><circle cx="15.5" cy="17.5" r="1.3"/></g>';
        const AD = '<path d="M3 9h5l9-5v16l-9-5H3z" fill="#ef4444"/><path d="M6 15l1.5 6h3L9 15z" fill="#b91c1c"/><path d="M20 9.5c1.3 1.5 1.3 3.5 0 5" ' + st("#ef4444", 1.8) + '/>';
        const CL = `<circle cx="12" cy="12" r="9" ${st("#6b7280")}/><path d="M12 7v5l3.5 2" ${st("#6b7280")}/>`;
        const MG = `<path d="M3 6h5c5 0 5 6 10 6M3 18h5c5 0 5-6 10-6M17 8l4 4-4 4" ${st("#8b5cf6")}/>`;

        const IF = `<path d="M3 12h6M9 12l8-6M9 12l8 6" ${st("#2fae6b")}/><circle cx="19" cy="6" r="2" fill="#2fae6b"/><circle cx="19" cy="18" r="2" fill="#2fae6b"/>`;
