  <!-- Live Simulation Modal -->
  <div id="sim-modal" class="sim-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="sim-modal-backdrop" id="sim-modal-backdrop"></div>
    <div class="sim-modal-dialog">
      <div class="sim-modal-header">

          <span class="badge badge-live">LIVE DEMO</span>
        </div>
        <div class="sim-modal-actions">
          <a id="sim-modal-ext" href="#" target="_blank" rel="noopener noreferrer" class="sim-modal-btn" title="Open full screen in new tab">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>

            </svg>
            <span>Open in New Tab</span>
          </a>
          <button id="sim-modal-close" class="sim-modal-close" aria-label="Close modal">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="sim-modal-body">
        <div id="sim-modal-spinner" class="sim-modal-spinner">
          <div class="spinner-ring"></div>
          <span>Loading live simulation...</span>
        </div>
        <iframe id="sim-modal-iframe" title="Workflow simulation runner" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </div>
