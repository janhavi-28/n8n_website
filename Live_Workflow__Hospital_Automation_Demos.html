<style>

.inb{margin:12px 0 0}.ib{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);opacity:0;animation:cr .5s forwards}.ib:last-child{border:0}.ib i{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:6px;flex:none}.ib i.g{background:var(--ok)}.ib b{display:block;font-size:13px}.ib small{color:var(--mut);font-size:12px}.ib .t{margin-left:auto;font-size:11px;color:var(--mut);white-space:nowrap}.cnt{display:inline-block;min-width:20px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--gold);color:#fff;font-size:11px;margin-left:6px}

</style></head><body><main>
<div class="top"><h1>Hospital Automation Demos</h1><span class="live"><i></i>LIVE SIMULATION</span></div>
<p class="sub">Three hospital workflows as they look inside n8n. All data is simulated and the WhatsApp or SMS steps are mock nodes. Pick a demo, then press the buttons.</p>
<div class="tabs" id="tabs"></div>
<h2 id="title" style="font-size:18px;color:var(--text);text-transform:none;letter-spacing:-.01em;margin:4px 0 2px"></h2>
<p class="sub" id="sub" style="margin-top:0"></p>
<div class="bar"><span id="bt" style="display:contents"></span><button id="play">Pause</button><button id="det">Node details: On</button></div>
<div class="cvw"><div class="cv"><div class="chip"><span id="chipt"></span> <b>● Active</b></div><svg id="w" viewBox="0 0 990 470" role="img" aria-label="n8n style hospital workflow"></svg></div><div class="ndv" id="ndv"></div></div>
<div class="card inb" id="inbox" style="display:none"><h2><span id="itt"></span> <span class="cnt" id="icnt">0</span></h2><div id="ibl"></div></div>
<div class="kpis" id="kpis"></div>
<div class="two"><div class="card"><h2 id="ctt"></h2><svg class="bars" id="ch" viewBox="0 0 340 130"></svg></div><div class="card"><h2>Activity log</h2><ul id="log"></ul></div></div>
</main>
<script>

el("path",{d:"M0 0L8 4L0 8z",class:"mk"},el("marker",{id:"ar",markerWidth:8,markerHeight:8,refX:7,refY:4,orient:"auto"},defs));

function addNode([id,name,sub,x,y,ic,tr]){const g=el("g",{class:"nd"},gN);
 el("path",{class:"b",d:tr?`M${x+32} ${y}H${x+52}a12 12 0 0 1 12 12V${y+52}a12 12 0 0 1-12 12H${x+32}a32 32 0 0 1 0-64z`:`M${x+12} ${y}H${x+52}a12 12 0 0 1 12 12V${y+52}a12 12 0 0 1-12 12H${x+12}a12 12 0 0 1-12-12V${y+12}a12 12 0 0 1 12-12z`},g);
 el("g",{transform:`translate(${x+16},${y+16}) scale(1.33)`},g).innerHTML=IC[ic];
 const L=wrap(name);L.forEach((t,i)=>el("text",{x:x+32,y:y+80+i*13},g).textContent=t);el("text",{x:x+32,y:y+80+L.length*13,class:"s"},g).textContent=sub;
 const b=el("g",{class:"bg"},g);el("circle",{cx:x+64,cy:y+4,r:9},b);el("path",{d:`M${x+59.5} ${y+4}l3.2 3.2 6-6.2`,fill:"none",stroke:"#fff","stroke-width":2,"stroke-linecap":"round"},b);
 D[id]={g,x,y}}

 const p=el("path",{class:"ed",d:`M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`,"marker-end":"url(#ar)"},gE);
 const t=lab?el("text",{x:x1+8,y:y1+dy,class:"il"},gE):null;if(t)t.textContent=lab;EDG.push({p,t});EK[a+">"+b]=EDG.length-1}

/* ---------- Demo 1 ---------- */

const U1={n:"Ramesh Desai",m:"Chest pain and sweating since morning",dep:"Cardiology",doc:"Dr. Kapoor",kw:"chest pain, sweating"};
async function run1(kind){
 if(running){pending.push(kind);return}running=true;reset();
 const urg=kind=="urgent",full=kind=="full",l=urg?U1:rnd(P1),secs=urg?5:6+Math.floor(Math.random()*9);
 const slot=urg?"Today, within 15 min":full?"Tomorrow, 10:30 AM":rnd(["Today, 4:30 PM","Tomorrow, 11:15 AM","Tomorrow, 9:45 AM"]);
 log(urg?`URGENT enquiry from ${l.n}: ${l.kw}`:`New enquiry from ${l.n} (website form)`,urg?"gold":"");
 await runV("trig",{params:{Trigger:"Form submitted",Page:"/book-appointment"},lines:["Visitor fills the enquiry form and clicks Submit",`Webhook receives <em>1 enquiry</em> from ${l.n}`],out:Tb(["Name","Message"],[[l.n,l.m]],"1 item")});
 await go("trig","ai");
 await runV("ai",{params:{Model:"Claude",Output:"JSON"},lines:[`<b>1.</b> Read: "${l.m}"`,`<b>2.</b> Intent: <em>Book appointment</em>`,`<b>3.</b> Keywords: <em>${l.kw}</em>`,`<b>4.</b> Urgency: <em class="${urg?"w":""}">${urg?"HIGH":"normal"}</em>`],out:Tb(["intent","urgency","keywords"],[["book",urg?"high":"normal",l.kw]])},urg?"gold":"");
 await go("ai","dept");
 await runV("dept",{params:{Language:"JavaScript",Table:"departments"},lines:["Match keywords to the department list",`Best match: <em>${l.dep}</em>`,`Doctor on duty: <em>${l.doc}</em>`],out:Tb(["Department","Doctor"],[[l.dep,l.doc]],"1 item")});
 await go("dept","avail");
 await runV("avail",{params:{Operation:"Select",Table:"doctor_slots"},lines:[`Query calendar of <em>${l.doc}</em>`,urg?"Urgent: take the next emergency slot":full?`<em class="w">0 free slots today</em>, checking tomorrow`:"3 free slots found today and tomorrow"],out:Tb(["Doctor","Next free"],[[l.doc,slot]],"1 slot")},full?"gold":"");
 await go("avail","book");
 await runV("book",{params:{App:"Calendar",Operation:"Create event"},lines:[`Create appointment: <em>${slot}</em>`,"Lock the slot so nobody else can take it",urg?"Page the on-call doctor now":"Reminder set for 2 hours before"],out:Tb(["Patient","Doctor","Slot"],[[l.n,l.doc,slot]],"1 booked")},urg?"gold":"");
 await both(["book","db"],["book","conf"]);
 const ph="+91 9"+Math.floor(1e8+Math.random()*9e8);
 const a=()=>runV("db",{params:{Operation:"Insert",Table:"appointments"},lines:["Add the patient record and appointment","Link to the department and doctor"],out:Tb(["id","patient","dept","slot"],[["APT-"+(5100+S.enq%900),l.n,l.dep,slot]],"1 row inserted")});
 const b=()=>runV("conf",{params:{Channel:"SMS and email",Template:"booking_confirmed"},lines:["Fill the confirmation template","Send to the number on the form"],out:card([["To",l.n+" · "+ph],["Message","Booking confirmed"]],`Hello ${l.n.split(" ")[0]}, your visit with <b>${l.doc}</b> (${l.dep}) is confirmed for <b>${slot}</b>. Reply 1 to reschedule.`)});
 if(detail){await a();await b()}else await Promise.all([a(),b()]);
 S.enq++;S.booked++;S.secs=(S.secs*(S.enq-1)+secs)/S.enq;if(Math.random()<.22)S.after++;S.hist.push(secs);S.xh.push(urg?1:0);if(S.hist.length>8){S.hist.shift();S.xh.shift()}S.session++;
 inboxAdd(`${l.n} with ${l.doc}`,`${l.dep} · ${slot}`,!urg);log(`${l.n} booked with ${l.doc}, ${slot}, replied in ${secs}s`,urg?"gold":"good");kp1(urg);chart();done()}
function kp1(f){setK("a",S.enq,nf,"+"+S.session+" this session");setK("b",S.secs,n=>n.toFixed(0)+"s","vs about 4 hours by hand",f);setK("c",S.booked/S.enq*100,pf,"no receptionist needed");setK("d",S.after,nf,"answered at night")}
/* ---------- Demo 2 ---------- */
const P2=[["Kavita Rao","Dr. Shah","10:00 AM"],["Imran Khan","Dr. Rao","11:30 AM"],["Sunita Jadhav","Dr. Menon","2:15 PM"],["Vikas More","Dr. Joshi","3:00 PM"],["Neha Gupta","Dr. Kapoor","9:30 AM"]];
const NSL={Tomorrow:"Tomorrow, 10:00 AM",Friday:"Friday, 11:30 AM","Next week":"Next Monday, 9:30 AM"};
async function run2(kind){
 if(running){pending.push(kind);return}running=true;reset();
 const nr=kind=="noreply",pts=[...P2].sort(()=>Math.random()-.5).slice(0,nr?2:2+Math.floor(Math.random()*2)).map((p,i,a)=>({n:p[0],d:p[1],t:p[2],r:nr&&i==a.length-1?null:(Math.random()<.1?null:rnd(Object.keys(NSL)))}));
 const rep=pts.filter(p=>p.r),miss=pts.filter(p=>!p.r);
 log(`Hourly check found ${pts.length} missed appointments`,"gold");
 await runV("cron",{params:{Trigger:"Schedule",Every:"1 hour"},lines:["Timer fires at the top of the hour","Start the no-show check"],out:Tb(["Run","Time"],[["hourly",tm()]])});
 await go("cron","find");
 await runV("find",{params:{Operation:"Select",Table:"appointments"},lines:["Rule: appointment time before now","AND patient not checked in",`Found <em>${pts.length}</em> matching appointments`],out:Tb(["Patient","Doctor","Was at"],pts.map(p=>[p.n,p.d,p.t]),pts.length+" rows")});
 await go("find","mark");
 await runV("mark",{params:{Operation:"Update",Field:"status"},lines:["Set status to <em>No Show</em>","Free the doctor's slot for walk-ins"],out:Tb(["Patient","Status"],pts.map(p=>[p.n,"No Show"]),pts.length+" rows updated")},"gold");
 await go("mark","gen");
 const msg=p=>`Hi ${p.n.split(" ")[0]}, we missed you today at ${p.t} with ${p.d}. Would you like to rebook? Reply: Tomorrow, Friday or Next week.`;
 await runV("gen",{params:{Model:"Claude",Tone:"Warm, short"},lines:[`Write one message per patient (<em>${pts.length}</em>)`,"Keep it kind, no blame","Offer three easy choices"],out:Tb(["Patient","Draft"],pts.map(p=>[p.n,msg(p).slice(0,46)+"..."]))});
 await go("gen","send");
 await runV("send",{params:{Channel:"WhatsApp (simulated)",Template:"noshow_rebook"},lines:["Send each draft to the patient","Delivery status: <em>delivered</em>"],out:card([["To",pts.map(p=>p.n).join(", ")],["Channel","WhatsApp (mock)"]],msg(pts[0]))});
 await go("send","reply");
 await runV("reply",{params:{Operation:"Wait for reply",Timeout:"2 hours"},lines:pts.map(p=>`${p.n}: <em class="${p.r?"":"w"}">${p.r||"no reply"}</em>`),out:Tb(["Patient","Reply"],pts.map(p=>[p.n,p.r||"-"]),rep.length+" replied")},miss.length?"gold":"");
 if(rep.length){await go("reply","book");
  await runV("book",{params:{App:"Calendar",Operation:"Create event"},lines:rep.map(p=>`${p.n} → <em>${NSL[p.r]}</em> with ${p.d}`),out:Tb(["Patient","New slot"],rep.map(p=>[p.n,NSL[p.r]]),rep.length+" booked")});
  await go("book","conf");
  await runV("conf",{params:{Channel:"SMS",Template:"rebook_confirmed"},lines:["Send the new time to each patient"],out:card([["To",rep.map(p=>p.n).join(", ")]],`Your new appointment is confirmed: ${rep.map(p=>NSL[p.r]).join(" / ")}. See you soon.`)});
  await go("conf","log")}
 await runV("log",{params:{App:"Google Sheets",Operation:"Append rows"},lines:["Write one row per patient","Include reply and new slot"],out:Tb(["Patient","Result"],pts.map(p=>[p.n,p.r?"Rebooked":"Call back"]),pts.length+" rows added")});
 rep.forEach(p=>inboxAdd(p.n+" rebooked",NSL[p.r]+" with "+p.d,true));miss.forEach(p=>inboxAdd("Call back: "+p.n,"No reply to the message, reception to call",false));
 S.det+=pts.length;S.rec+=rep.length;S.hist.push(rep.length);S.xh.push(miss.length?1:0);if(S.hist.length>8){S.hist.shift();S.xh.shift()}S.session+=pts.length;
 log(`${rep.length} of ${pts.length} rebooked${miss.length?`, ${miss.length} sent to the call list`:""}`,miss.length?"gold":"good");kp2(miss.length);chart();done()}
function kp2(f){setK("a",S.det,nf,"+"+S.session+" this session");setK("b",S.rec,nf,"patients rebooked");setK("c",S.rec/S.det*100,pf,"of no-shows",f);setK("d",S.rec*800,n=>"₹"+nf(n),"at ₹800 per visit")}
/* ---------- Demo 3 ---------- */
const P3=[["Lakshmi Naik","Knee replacement"],["Rohan Mehta","Appendectomy"],["Shweta Pawar","Normal delivery"],["Prakash Hegde","Cardiac stent"]];
const POS=["Doing much better, thank you. The nurses were wonderful.","Recovery is going well. Thanks to the whole team.","Feeling good, no problems at all."],NEG=["Still in a lot of pain and nobody called me about a billing mistake.","Wound is not healing and I could not reach anyone.","Discharge instructions were unclear and I am worried."];
async function run3(kind){
 if(running){pending.push(kind);return}running=true;reset();
 const neg=kind=="unhappy"||(!kind&&Math.random()<.25),[n,pr]=rnd(P3),first=n.split(" ")[0],txt=neg?rnd(NEG):rnd(POS),score=neg?12+Math.floor(Math.random()*24):80+Math.floor(Math.random()*19),tk="TKT-"+(2200+S.res+S.q);
 log(`${n} discharged after ${pr}`,"");
 await runV("trig",{params:{Trigger:"Webhook",Source:"Hospital system"},lines:["Billing marks the patient as discharged",`Event: <em>${n}</em>, ${pr}`],out:Tb(["Patient","Procedure"],[[n,pr]],"1 item")});
 await go("trig","wait");
 await runV("wait",{params:{Resume:"After 3 days"},lines:["Pause this patient's flow for <em>3 days</em>","Timer fires (demo fast-forwards)","Resume the workflow"],out:Tb(["Patient","Resumes"],[[n,"in 3 days"]])});
 await go("wait","send");
 await runV("send",{params:{Channel:"SMS (simulated)",Template:"follow_up_day3"},lines:["Fill the follow-up template","Send to the patient's number"],out:card([["To",n],["Channel","SMS (mock)"]],`Hi ${first}, this is the care team. How are you feeling after your ${pr.toLowerCase()}? Just reply to this message.`)});
 await go("send","reply");
 await runV("reply",{params:{Operation:"Wait for reply",Timeout:"24 hours"},lines:[`Reply from ${n} received`,`"${txt}"`],out:Tb(["Patient","Reply"],[[n,txt.slice(0,50)+"..."]],"1 reply")});
 await go("reply","ai");
 await runV("ai",{params:{Model:"Claude",Task:"Sentiment and topic"},lines:["<b>1.</b> Read the reply",`<b>2.</b> Sentiment: <em class="${neg?"w":""}">${neg?"NEGATIVE":"POSITIVE"}</em> (${score}/100)`,`<b>3.</b> Topic: <em>${neg?(txt.includes("bill")?"billing":txt.includes("wound")?"wound care":"discharge info"):"care quality"}</em>`],out:Tb(["sentiment","score"],[[neg?"negative":"positive",score]])},neg?"gold":"");
 await go("ai","iff");
 await runV("iff",{params:{Condition:"Sentiment is positive"},lines:[`Score <em>${score}</em>`,`Result: <em class="${neg?"w":""}">${neg?"FALSE":"TRUE"}</em>`,neg?"Branch FALSE: create a ticket":"Branch TRUE: thank and ask for a review"],out:Tb(["Positive"],[[neg?"no":"yes"]])});
 if(!neg){await go("iff","thanks");
  await runV("thanks",{params:{Channel:"SMS",Template:"thank_you"},lines:["Send a short thank-you message"],out:card([["To",n]],`Thank you ${first}! We are glad you are recovering well.`)});
  await go("thanks","review");
  await runV("review",{params:{Link:"Google review page"},lines:["Add the hospital's Google review link","Send the request"],out:card([["To",n]],`If you have a minute, a Google review helps other patients find us: <b>g.page/hospital/review</b>`)});
  S.rev++;inboxAdd(`${n}: review requested`,"Happy patient, Google review link sent",true)}
 else{await go("iff","ticket","gold");
  await runV("ticket",{params:{App:"Helpdesk",Priority:"High"},lines:[`Create ticket <em>${tk}</em>`,"Attach the patient's reply and score"],out:Tb(["Ticket","Patient","Priority"],[[tk,n,"High"]],"1 ticket")},"gold");
  await go("ticket","notify");
  await runV("notify",{params:{Channel:"Email and SMS",To:"Patient care manager"},lines:["Alert the manager right away",`Subject: <em>Unhappy patient: ${n}</em>`],out:card([["To","care.manager@hospital.in"],["Subject","Unhappy patient: "+n]],`${n} (${pr}) replied: "${txt}" Ticket ${tk}.`)},"gold");
  await go("notify","mgr");
  await runV("mgr",{params:{Task:"Manual step",SLA:"Same day"},lines:["Manager calls the patient","Fixes the issue and notes the outcome","Close the ticket: <em>Resolved</em>"],out:Tb(["Ticket","Status"],[[tk,"Resolved"]],"1 ticket closed")});
  S.res++;inboxAdd(`${tk}: ${n}`,"Manager called, issue resolved",false)}
 S.sent++;S.rep++;S.hist.push(score);S.xh.push(neg?1:0);if(S.hist.length>8){S.hist.shift();S.xh.shift()}S.session++;
 log(neg?`${n} unhappy, ${tk} resolved by manager`:`${n} happy, review requested`,neg?"bad":"good");kp3(neg);chart();done()}
function kp3(f){setK("a",S.sent,nf,"+"+S.session+" this session");setK("b",S.rep/S.sent*100,pf,"patients answered");setK("c",S.rev,nf,"Google reviews asked");setK("d",S.res,nf,"unhappy patients fixed",f)}
